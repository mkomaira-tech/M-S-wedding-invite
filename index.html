<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mohammad & Sarah Wedding ✨</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================
            الثيم الجديد: صناديق #F2EFEA ونصوص ذهبية
        ========================================= */
        :root {
            --gold: #D4AF37; 
            --gold-dark: #B8860B; /* ذهبي أغمق قليلاً للوضوح على الخلفية الفاتحة */
            --gold-light: #F9E596; 
            
            /* لون الصناديق */
            --bg-box-solid: #F2EFEA; 
            --bg-box: rgba(242, 239, 234, 0.95); /* لون #F2EFEA مع شفافية خفيفة جداً */
            
            /* ألوان النصوص الذهبية */
            --text-main: var(--gold-dark); 
            --text-h1: var(--gold-dark); 
            --text-muted: #C5A040; /* ذهبي ناعم للنصوص الثانوية */
            
            --red-main: #C0392B; 
            --red-light: #E74C3C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
        }

            *::-webkit-scrollbar {
                display: none;
            }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #111; 
            background-image: url("https://cdvotvobfynweyaouuyo.supabase.co/storage/v1/object/public/wedding-photos/background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            direction: rtl;
            touch-action: pan-y;
        }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6); /* خلفية داكنة لتبرز الصورة والصناديق الفاتحة */
                z-index: -1;
            }

        /* =========================================
            المقدمة السينمائية
        ========================================= */
        #cinematic-intro {
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 15, 0.85); 
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s ease-out;
        }

        .bg-img-intro {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://cdvotvobfynweyaouuyo.supabase.co/storage/v1/object/public/wedding-photos/background.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.45; 
            animation: slowZoom 20s ease-in-out infinite alternate;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .intro-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 30px 40px;
            /* تمت إزالة الصندوق والظل لتبقى الأسماء حرة */
        }

            .intro-content h1 {
                color: var(--text-h1); 
                font-family: 'Amiri', serif;
                font-size: clamp(2.8rem, 10vw, 5rem);
                text-shadow: 0px 4px 15px rgba(0,0,0,0.6); /* ظل لإبراز الاسم على الصورة */
            }

            .intro-content p {
                color: var(--text-main); 
                font-size: clamp(1.2rem, 3vw, 1.5rem);
                letter-spacing: 3px;
                margin-top: 10px;
                font-weight: bold;
                text-shadow: 0px 2px 10px rgba(0,0,0,0.5);
            }

        #enter-btn {
            position: absolute;
            bottom: 12%;
            z-index: 2;
            padding: 12px 35px;
            border-radius: 50px;
            border: 2px solid var(--gold);
            background: var(--bg-box-solid); /* زر الدخول باللون الفاتح */
            color: var(--text-main); /* نص الزر ذهبي */
            font-weight: 900;
            font-size: 1.1rem;
            font-family: 'Cairo';
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

            #enter-btn:hover {
                background: var(--gold);
                color: var(--bg-box-solid);
            }

        /* =========================================
            الواجهة الرئيسية والتبويبات
        ========================================= */
        #main-app {
            position: relative;
            z-index: 1;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px 10px;
            margin: 15px auto;
            max-width: 600px;
            /* تمت إزالة الصندوق والظل من حول الأسماء في الأعلى */
        }

        .hero-title {
            font-family: 'Amiri', serif;
            font-size: clamp(2.5rem, 9vw, 4rem);
            color: var(--text-h1); 
            text-shadow: 0px 4px 15px rgba(0,0,0,0.6); /* ظل لإبراز الاسم */
        }

        h2 {
            font-family: 'Amiri', serif;
            color: var(--text-h1); 
            text-align: center;
            margin: 20px 0;
            font-size: 2.2rem;
            background: var(--bg-box);
            display: inline-block;
            padding: 5px 30px;
            border-radius: 30px;
            border: 1px solid var(--gold);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* حاوية العنوان لتوسيطه */
        .h2-container {
            text-align: center;
        }

        h3 {
            color: var(--text-main); 
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.5); /* إضافة ظل خفيف للعنوان الفرعي تحت الأسماء */
        }

        .page {
            display: none;
            padding: 10px 20px;
            animation: slideHorizontal 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

            .page.active {
                display: block;
            }

        @keyframes slideHorizontal {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .trio-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(5px, 2vw, 15px);
            margin: 20px auto;
            width: fit-content;
            padding: clamp(10px, 3vw, 20px);
            background: var(--bg-box); /* صندوق الصور */
            border-radius: 20px;
            position: relative;
            border: 1px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .trio-container img {
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 2;
            transition: transform 0.3s;
        }

        .trio-container .img-card {
            width: clamp(150px, 45vw, 350px);
            cursor: pointer;
        }

        .card, .countdown-wrap {
            background: var(--bg-box); /* خلفية الكروت والعداد */
            border: 1px solid var(--gold);
            border-radius: 18px;
            padding: 20px;
            margin: 15px auto;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

            .card p {
                color: var(--text-main); 
                font-size: 1.1rem;
                font-weight: 600;
                text-shadow: none; /* إزالة الظل داخل الصناديق الفاتحة */
            }

        /* --- العداد --- */
        .countdown-wrap {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 2vw, 20px);
            text-align: center;
        }

            .countdown-wrap .box {
                display: flex;
                flex-direction: column;
                align-items: center;
                min-width: clamp(55px, 18vw, 80px);
            }

            .countdown-wrap .num {
                font-size: clamp(1.5rem, 7vw, 2.5rem);
                color: var(--text-h1); 
                font-weight: bold;
                line-height: 1;
            }

            .countdown-wrap .lbl {
                font-size: clamp(0.75rem, 3vw, 1rem);
                color: var(--text-muted);
                font-weight: bold;
            }

        /* --- الخريطة --- */
        .map-wrap iframe {
            width: 100%;
            height: clamp(250px, 50vh, 350px);
            border: none;
            border-radius: 15px;
        }

        /* --- نافذة التكبير --- */
        #image-modal {
            display: none;
            position: fixed;
            z-index: 100000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* النافذة المنبثقة للصور تظل سوداء لكي تبرز الصورة */
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

            #image-modal.show {
                display: flex;
                opacity: 1;
            }

        #modal-img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(212,175,55,0.3);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        #image-modal.show #modal-img {
            transform: scale(1);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            color: var(--gold);
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

            .close-modal:hover {
                color: var(--gold-light);
            }

        /* --- الأزرار وحقول الإدخال --- */
        .btn {
            display: block;
            width: 100%;
            background: var(--bg-box-solid);
            border: 2px solid var(--gold);
            color: var(--text-main) !important; /* نص ذهبي */
            text-align: center;
            padding: 12px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin: 15px auto;
            font-size: 1.1rem;
            font-family: 'Cairo';
            cursor: pointer;
            transition: 0.3s;
        }

            .btn:hover {
                background: var(--gold);
                color: var(--bg-box-solid) !important;
            }

        /* زر Wish Money */
        .btn-wish {
            background: linear-gradient(135deg, var(--red-main), var(--red-light)) !important;
            color: #FFF !important;
            border: none;
            box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3);
        }

            .btn-wish:hover {
                background: linear-gradient(135deg, var(--red-light), var(--red-main)) !important;
            }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: #FFFFFF; /* حقول الكتابة بيضاء للوضوح التام داخل الصندوق الـ F2EFEA */
            border: 1px solid var(--gold);
            border-radius: 12px;
            color: var(--text-main); 
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
        }

            .form-input::placeholder { color: #A08C5B; font-weight: normal; } 
            .form-input:focus { border-color: var(--gold-dark); box-shadow: 0 0 8px rgba(212,175,55,0.4); }

        .ticket-box {
            background: #FFFFFF;
            border: 2px dashed var(--gold);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            animation: fadeSlideUp 0.5s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .lang-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--bg-box);
            border: 2px solid var(--gold);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

            .lang-btn:hover { background: var(--gold); color: var(--bg-box-solid); }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 480px; 
            background: var(--bg-box); /* شريط التنقل */
            border: 1px solid var(--gold);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 5px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo';
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            transition: 0.3s;
            flex: 1; 
        }

            .nav-item span {
                font-size: 0.8rem;
                display: block;
                margin-top: 2px;
            }

            .nav-item.active {
                color: var(--bg-box-solid); /* الأيقونة والنص باللون الفاتح عندما يكون مفعلاً */
                background: var(--gold); /* خلفية العنصر المفعل ذهبية */
                transform: translateY(-5px);
                font-weight: bold;
                box-shadow: 0 4px 10px rgba(212,175,55,0.4);
            }
    </style>
</head>

                langToggle.innerHTML = currentLang === 'ar' ? 'English 🌐' : 'عربي 🌐';
                langToggle.style.left = currentLang === 'ar' ? '15px' : 'auto';
                langToggle.style.right = currentLang === 'ar' ? 'auto' : '15px';
                
                document.querySelector('#cinematic-intro p').innerHTML = translations[currentLang].titleDate;
                document.getElementById('enter-btn').innerHTML = translations[currentLang].enter;
                document.querySelector('header h3').innerHTML = translations[currentLang].headerSub;
                
                const timeLabels = document.querySelectorAll('.countdown-wrap .lbl');
                if(timeLabels.length > 0) {
                    timeLabels[0].innerHTML = translations[currentLang].d;
                    timeLabels[1].innerHTML = translations[currentLang].h;
                    timeLabels[2].innerHTML = translations[currentLang].m;
                    timeLabels[3].innerHTML = translations[currentLang].s;
                }

                const rsvpH2 = document.querySelector('#tab-rsvp h2');
                if(rsvpH2) rsvpH2.innerHTML = translations[currentLang].rsvpH2;
                
                const giftsH2 = document.querySelector('#tab-gifts h2');
                if(giftsH2) giftsH2.innerHTML = translations[currentLang].giftsH2;

                const nameInput = document.getElementById('guest-name');
                if(nameInput) nameInput.placeholder = translations[currentLang].namePlace;
                
                const sideSelect = document.getElementById('guest-side');
                if(sideSelect) {
                    sideSelect.options[0].text = translations[currentLang].side1;
                    sideSelect.options[1].text = translations[currentLang].side2;
                }
                
                const submitBtn = document.getElementById('submit-rsvp');
                if(submitBtn && !submitBtn.disabled) submitBtn.innerHTML = translations[currentLang].submitRsvp;
                
                const wishH3 = document.querySelector('#tab-gifts h3');
                if(wishH3) wishH3.innerHTML = translations[currentLang].wishTitle;
                
                const wishP = document.querySelector('#tab-gifts h3 + p');
                if(wishP) wishP.innerHTML = translations[currentLang].wishDesc;
                
                const wishAppBtn = document.querySelector('a[href="https://www.whish.money/"]');
                if(wishAppBtn) wishAppBtn.innerHTML = translations[currentLang].wishBtn;
                
                const locH2 = document.querySelector('#tab-location h2');
                if(locH2) locH2.innerHTML = translations[currentLang].locTitle;

                const navSpans = document.querySelectorAll('.nav-item span');
                if(navSpans.length > 0) {
                    navSpans[0].innerHTML = translations[currentLang].nav1;
                    navSpans[1].innerHTML = translations[currentLang].nav2;
                    navSpans[2].innerHTML = translations[currentLang].nav3; 
                    navSpans[3].innerHTML = translations[currentLang].nav4; 
                }

                const copyBtnEl = document.getElementById('copy-number-btn');
                if(copyBtnEl && !copyBtnEl.innerText.includes('✅')) {
                    copyBtnEl.innerText = currentLang === 'ar' ? `رقم الحساب: ${WISH_NUMBER} ${translations[currentLang].copyBtn}` : `Account: ${WISH_NUMBER} ${translations[currentLang].copyBtn}`;
                }

                const ticketBoxP1 = document.querySelector('.ticket-box p:first-child');
                const ticketBoxP2 = document.querySelector('.ticket-box p:last-child');
                if(ticketBoxP1 && nameInput && nameInput.value) {
                    ticketBoxP1.innerHTML = translations[currentLang].vipTicket;
                    ticketBoxP2.innerHTML = `${translations[currentLang].welcome} <b style="color:var(--text-h1);">${nameInput.value}</b>`;
                }
            });

            // --- نظام تكبير الصورة في الرئيسية ---
            const imageModal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const imgCard = document.querySelector('.img-card');
            const closeModal = document.querySelector('.close-modal');

            if(imgCard) {
                imgCard.addEventListener('click', function() {
                    modalImg.src = this.src;
                    imageModal.style.display = 'flex';
                    setTimeout(() => {
                        imageModal.classList.add('show');
                    }, 10);
                });
            }

            function closeImageModal() {
                imageModal.classList.remove('show');
                setTimeout(() => {
                    imageModal.style.display = 'none';
                }, 300);
            }

            if(closeModal) {
                closeModal.addEventListener('click', closeImageModal);
            }

            if(imageModal) {
                imageModal.addEventListener('click', function(e) {
                    if (e.target === imageModal) {
                        closeImageModal();
                    }
                });
            }

            // 1. الدخول للموقع
            document.getElementById('enter-btn').addEventListener('click', () => {
                const intro = document.getElementById('cinematic-intro');
                intro.style.opacity = '0';
                setTimeout(() => { intro.style.display = 'none'; document.getElementById('main-app').style.display = 'block'; }, 1000);
            });

            // 2. نظام التبويبات
            const navItems = document.querySelectorAll('.nav-item');
            const pages = document.querySelectorAll('.page');
            const tabsArray = ['tab-home', 'tab-rsvp', 'tab-gifts', 'tab-location'];

            function switchTab(targetId) {
                navItems.forEach(btn => btn.classList.remove('active'));
                pages.forEach(page => page.classList.remove('active'));
                document.querySelector(`.nav-item[data-target="${targetId}"]`).classList.add('active');
                document.getElementById(targetId).classList.add('active');
            }

            navItems.forEach(item => {
                item.addEventListener('click', () => switchTab(item.getAttribute('data-target')));
            });

            // 3. نظام السحب الآمن
            let startX = 0, startY = 0, isDragging = false;
            const pagesContainer = document.getElementById('pages-container');

            pagesContainer.addEventListener('pointerdown', e => {
                if (['INPUT', 'SELECT', 'BUTTON', 'A'].includes(e.target.tagName)) return;
                startX = e.clientX; startY = e.clientY; isDragging = true;
            }, {passive: true});

            pagesContainer.addEventListener('pointerup', e => {
                if (!isDragging) return;
                isDragging = false;
                let diffX = startX - e.clientX;
                let diffY = startY - e.clientY;

                if (Math.abs(diffX) > 70 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
                    const activePage = document.querySelector('.page.active');
                    if(!activePage) return;
                    let currentIndex = tabsArray.indexOf(activePage.id);

                    if (diffX > 0 && currentIndex < tabsArray.length - 1) {
                        switchTab(tabsArray[currentIndex + 1]);
                    } else if (diffX < 0 && currentIndex > 0) {
                        switchTab(tabsArray[currentIndex - 1]);
                    }
                }
            }, {passive: true});

            // --- برمجة زر النسخ الذكي ---
            const copyBtn = document.getElementById('copy-number-btn');
            copyBtn.innerText = `رقم الحساب: ${WISH_NUMBER} (اضغط للنسخ 📋)`;

            copyBtn.addEventListener('click', function() {
                navigator.clipboard.writeText(WISH_NUMBER).then(() => {
                    this.innerText = "✅ تم نسخ الرقم بنجاح!";
                    this.style.background = "rgba(74, 222, 128, 0.2)";
                    this.style.borderColor = "#4ade80";
                    this.style.color = "#4ade80";

                    setTimeout(() => {
                        this.innerText = `رقم الحساب: ${WISH_NUMBER} (اضغط للنسخ 📋)`;
                        this.style.background = "rgba(192, 57, 43, 0.05)";
                        this.style.borderColor = "var(--red-light)";
                        this.style.color = "var(--red-light)";
                    }, 3000);
                });
            });

            // --- برمجة زر إرسال RSVP الذكي ---
            document.getElementById('submit-rsvp').addEventListener('click', async function() {
                const nameInput = document.getElementById('guest-name').value.trim();
                const sideInput = document.getElementById('guest-side').value;
                const btn = this;
                const ticketBox = document.getElementById('ticket-container');

                if (!nameInput) { alert("يرجى إدخال اسمك الكريم أولاً!"); return; }

                btn.innerText = "Please wait... ⏳"; 
                btn.disabled = true;
                btn.style.opacity = "0.7";

                const total = 1;

                try {
                    if (!supabaseClient) throw new Error("مكتبة Supabase لم تتصل. تأكد من اتصالك بالإنترنت.");

                    let currentTable = "قيد الانتظار ⏳";

                    const { data: existing, error: searchError } = await supabaseClient
                        .from('guests')
                        .select('*')
                        .eq('name', nameInput);

                    if (searchError) throw new Error(searchError.message);

                    if (existing && existing.length > 0) {
                        currentTable = existing[0].table_number || "قيد الانتظار ⏳";
                        alert(`${translations[currentLang].welcomeBack} ${nameInput}! ${translations[currentLang].alreadyRegistered}`);
                    }
                    else {
                        const { error: insertError } = await supabaseClient.from('guests').insert([{
                            name: nameInput,
                            side: sideInput,
                            companions: "بدون مرافقين",
                            total_persons: total,
                            table_number: "قيد الانتظار ⏳"
                        }]);

                        if (insertError) throw new Error(insertError.message);

                        const { data: allGuests } = await supabaseClient.from('guests').select('side, total_persons');
                        let groomCount = 0;
                        let brideCount = 0;
                        
                        if (allGuests) {
                            allGuests.forEach(guest => {
                                const p = guest.total_persons || 1;
                                if (guest.side && guest.side.includes('العريس')) groomCount += p;
                                else if (guest.side && guest.side.includes('العروس')) brideCount += p;
                            });
                        }
                        const totalCount = groomCount + brideCount;

                        const msg = `🎊 *ضيف جديد سجّل حضوره!*\n\n👤 الاسم: ${nameInput}\n📍 الجهة: ${sideInput}\n\n📊 *إحصائيات الحضور حتى الآن:*\n🤵 جهة العريس: ${groomCount}\n👰 جهة العروس: ${brideCount}\n👥 الإجمالي: ${totalCount}`;
                        
                        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: 'Markdown' })
                        });
                    }

                    btn.style.display = 'none';
                    ticketBox.style.display = 'block';
                    ticketBox.innerHTML = `
                        <div class="ticket-box">
                            <p style="color:var(--text-h1); font-family:'Amiri',serif; font-size:1.6rem; margin-bottom:5px;">${translations[currentLang].vipTicket}</p>
                            <p style="color:var(--text-main); font-size:1.1rem; margin-bottom:8px;">${translations[currentLang].welcome} <b style="color:var(--text-h1);">${nameInput}</b></p>
                        </div>
                    `;

                } catch (error) {
                    alert("⚠️ خطأ تقني من قاعدة البيانات:\n" + error.message);
                    btn.innerText = translations[currentLang].submitRsvp;
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }
            });

            // 4. العداد
            const weddingDate = new Date("May 31, 2026 19:00:00").getTime();
            setInterval(() => {
                const distance = weddingDate - new Date().getTime();
                if (distance > 0) {
                    document.getElementById('d').innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                    document.getElementById('h').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    document.getElementById('m').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    document.getElementById('s').innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
                }
            }, 1000);
        });
    </script>
</body>
</html>
